  <title id="title">Bloodborne for Windows — TatsunaKyo revision</title>
  <desc id="description">TatsunaKyo's signed Windows revision, with DLSS, FSR, XeSS, Frame Generation, HDR and Reflex. An original ink-style hunter and Gothic skyline stand beneath a red moon.</desc>
