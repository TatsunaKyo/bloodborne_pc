<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="700" viewBox="0 0 1800 700" role="img" aria-labelledby="title desc">
  <title id="title">Bloodborne: The Crowned Workshop — TatsunaKyo</title>
  <desc id="desc">TatsunaKyo's crowned TK emblem beside the project title. A solitary hunter stands at a Gothic workbench lit by a warm lantern. An enormous pale-red moon fills the tall window. Original workshop artwork and editable lettering.</desc>
  <image id="workshop-art" x="0" y="0" width="1800" height="700" preserveAspectRatio="xMidYMid slice" xlink:href="crowned-workshop-art-lantern.png"/>
  <g id="personal-emblem" transform="translate(82 63) scale(.59)" fill="none" stroke="#d6c1a1" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter">
    <path id="crown" d="M54 74L47 34L90 54L128 18L166 54L209 34L202 74M58 87H198"/>
    <path id="workshop-arch" d="M47 218V153Q47 122 128 101Q209 122 209 153V218"/>
    <path id="initial-t" d="M75 137H137M106 137V216"/>
    <path id="initial-k" d="M151 137V216M186 137L151 174L189 216"/>
    <path id="workbench" d="M40 237H216M57 237V246M199 237V246"/>
  </g>
