    <text id="game-title" x="85" y="341" font-size="98" letter-spacing="1.8" fill="#f1e9dc" textLength="744" lengthAdjust="spacingAndGlyphs">BLOODBORNE</text>
    <path id="title-rule" d="M92 374H818" fill="none" stroke="#8d7964" stroke-width="1.5"/>
    <text id="workshop-title-one" x="87" y="465" font-size="71" fill="#ede3d2">The Crowned</text>
    <text id="workshop-title-two" x="87" y="555" font-size="71" fill="#ede3d2">Workshop</text>
  </g>
</svg>
