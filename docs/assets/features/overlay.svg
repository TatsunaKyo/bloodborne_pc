</ns0:g><ns0:text x="32" y="56" font-family="DejaVu Serif" font-size="32" text-anchor="start" fill="#d6c1a1">A compact overlay, with the frametime graph</ns0:text><ns0:path d="M32 82H968" stroke="#49453d" stroke-width="1" fill="none" opacity="1" /><ns0:text x="32" y="125" font-family="DejaVu Sans" font-size="27" text-anchor="start" fill="#efe6d8">Start with the basic readout. Add only what you want.</ns0:text><ns0:image x="48" y="165" width="904" height="152.98461538461538" href="overlay-ui.webp" /><ns0:text x="32" y="365.9846153846154" font-family="DejaVu Sans" font-size="24" text-anchor="start" fill="#efe6d8">Output FPS / FG mode · preset letter · input → output · PC latency</ns0:text><ns0:text x="32" y="407.9846153846154" font-family="DejaVu Sans" font-size="24" text-anchor="start" fill="#efe6d8">The optional graph shows raw real-frame intervals, including spikes.</ns0:text><ns0:text x="32" y="464.9846153846154" font-family="DejaVu Sans" font-size="23" text-anchor="start" fill="#b9b0a2">Example readout · synthetic frametime data</ns0:text></ns0:svg>