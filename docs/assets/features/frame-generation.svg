</g><text x="34" y="77" font-family="DejaVu Serif" font-size="39" text-anchor="start" fill="#d6c1a1">FRAME GENERATION + HDR</text><path d="M34 103H966" stroke="#49453d"/><text x="34" y="156" font-family="DejaVu Sans" font-size="32" text-anchor="start" fill="#d6c1a1">Real frames keep the game moving</text><rect x="34" y="181" width="142" height="70" rx="5" fill="#171c21" stroke="#49453d"/><text x="105" y="227" font-family="DejaVu Sans" font-size="32" text-anchor="middle" fill="#efe6d8">REAL</text><rect x="191" y="181" width="142" height="70" rx="5" fill="#171c21" stroke="#49453d"/><text x="262" y="227" font-family="DejaVu Sans" font-size="32" text-anchor="middle" fill="#d6c1a1">FG</text><rect x="348" y="181" width="142" height="70" rx="5" fill="#171c21" stroke="#49453d"/><text x="419" y="227" font-family="DejaVu Sans" font-size="32" text-anchor="middle" fill="#efe6d8">REAL</text><rect x="505" y="181" width="142" height="70" rx="5" fill="#171c21" stroke="#49453d"/><text x="576" y="227" font-family="DejaVu Sans" font-size="32" text-anchor="middle" fill="#d6c1a1">FG</text><rect x="662" y="181" width="142" height="70" rx="5" fill="#171c21" stroke="#49453d"/><text x="733" y="227" font-family="DejaVu Sans" font-size="32" text-anchor="middle" fill="#efe6d8">REAL</text><rect x="819" y="181" width="142" height="70" rx="5" fill="#171c21" stroke="#49453d"/><text x="890" y="227" font-family="DejaVu Sans" font-size="32" text-anchor="middle" fill="#d6c1a1">FG</text><text x="34" y="297" font-family="DejaVu Sans" font-size="32" text-anchor="start" fill="#efe6d8">FG adds display updates between them</text><rect x="34" y="330" width="220" height="46" rx="5" fill="#171c21" stroke="#49453d"/><text x="144.0" y="363" font-family="DejaVu Sans" font-size="30" text-anchor="middle" fill="#d6c1a1">FSR ×2</text><rect x="270" y="330" width="390" height="46" rx="5" fill="#171c21" stroke="#49453d"/><text x="465.0" y="363" font-family="DejaVu Sans" font-size="30" text-anchor="middle" fill="#d6c1a1"