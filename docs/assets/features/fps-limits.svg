<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">FRAME CAPS + BACKGROUND</title><desc id="desc">Real and optional output caps work together. Exact entries complement relative dragging. Background pause or 30/60 FPS is optional; generated frames are disabled under a background cap.</desc><rect width="1000" height="500" fill="#0c0f12"/><rect x="12" y="12" width="976" height="476" rx="5" fill="none" stroke="#49453d"/><g transform="translate(895 24) scale(.23)" color="#d6c1a1"><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter">
    <ns0:path id="crown" d="M54 74L47 34L90 54L128 18L166 54L209 34L202 74M58 87H198" />
    <ns0:path id="workshop-arch" d="M47 218V153Q47 122 128 101Q209 122 209 153V218" />
    <ns0:path id="initial-t" d="M75 137H137M106 137V216" />
    <ns0:path id="initial-k" d="M151 137V216M186 137L151 174L189 216" />
