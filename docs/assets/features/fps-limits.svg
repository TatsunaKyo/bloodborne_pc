</g><text x="34" y="77" font-family="DejaVu Serif" font-size="39" text-anchor="start" fill="#d6c1a1">FRAME CAPS + BACKGROUND</text><path d="M34 103H966" stroke="#49453d"/><rect x="34" y="126" width="932" height="184" rx="5" fill="#171c21" stroke="#49453d"/><text x="54" y="167" font-family="DejaVu Sans" font-size="34" text-anchor="start" fill="#d6c1a1">Real cap 75 FPS + ×2 FG</text><text x="54" y="217" font-family="DejaVu Sans" font-size="32" text-anchor="start" fill="#efe6d8">Output cap off</text><path d="M374 206h48m-12-10l12 10-12 10" fill="none" stroke="#d6c1a1" stroke-width="3"/><text x="447" y="217" font-family="DejaVu Sans" font-size="32" text-anchor="start" fill="#efe6d8">Up to 150 output FPS</text><text x="54" y="271" font-family="DejaVu Sans" font-size="32" text-anchor="start" fill="#efe6d8">Output cap 120</text><path d="M374 260h48m-12-10l12 10-12 10" fill="none" stroke="#d6c1a1" stroke-width="3"/><text x="447" y="271" font-family="DejaVu Sans" font-size="32" text-anchor="start" fill="#efe6d8">Up to 60 real + 60 FG</text><text x="34" y="359" font-family="DejaVu Sans" font-size="32" text-anchor="start" fill="#d6c1a1">Drag gently, use arrows, or type the number</text><rect x="34" y="387" width="220" height="46" rx="5" fill="#171c21" stroke="#49453d"/><text x="144.0" y="420" font-family="DejaVu Sans" font-size="30" text-anchor="middle" fill="#d6c1a1">Pause</text><rect x="277" y="387" width="220" height="46" rx="5" fill="#171c21" stroke="#49453d"/><text x="387.0" y="420" font-family="DejaVu Sans" font-size="30" text-anchor="middle" fill="#d6c1a1">30 FPS</text><rect x="520" y="387" width="220" height="46" rx="5" fill="#171c21" stroke="#49453d"/><text x="630.0" y="420" font-family="DejaVu Sans" font-size="30" text-anchor="middle" fill="#d6c1a1">60 FPS</text><text x="34" y="472" font-family="DejaVu Sans" font-size="30" text-anchor="start" fill="#b9b0a2">Background policy returns to your foreground cap</text></svg>
