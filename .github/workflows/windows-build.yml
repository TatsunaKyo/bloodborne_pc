name: Windows build and package
on:
  push:
    branches: [polish/upstream-197-20261102]
  workflow_dispatch:
    inputs:
      channel:
        description: Publication channel for the prepared form; this job does not publish
        type: choice
        options: [stable, preview]
        default: stable
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '3'
concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Share checkout settings between Windows Git and MSYS2 Git
        shell: pwsh
        run: |
          $autocrlf = git config --get core.autocrlf
          if (!$autocrlf) { $autocrlf = 'false' }
          git config --local core.autocrlf $autocrlf
          git config --local core.filemode false
          git diff --exit-code --stat --ignore-submodules=all HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Remember Windows Python
        shell: pwsh
        run: '"WINPYTHON=$((Get-Command python).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          update: false
          install: git patch
      - name: Download and verify pinned dependencies
        shell: pwsh
        run: python tools/fetch_windows_dependencies.py
      - name: Install the pinned CLANG64 package set
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git diff --exit-code --stat --ignore-submodules=all HEAD
          pacman -U --noconfirm out/dependencies/*.pkg.tar.zst
      - name: Install Python dependencies for launcher tests
        run: python -m pip install PyInstaller==6.19.0 Pillow==12.3.0
      - name: Check archive assembly, launch timing and the incompatible executable fallback
        shell: pwsh
        run: |
          python tests/test_packaged_startup.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_packaged_startup.py --reject
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_release_integrity.py
      - name: Compile native programs and regression executables
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bash build.sh
          ninja -C out/gpu -j2 frame-limits-test frame-pacing-test background-pause-test temporal-history-test motion-history-test xess-presets-test amd-antilag-test camera-motion-test save-access-test
          git diff --exit-code --stat --ignore-submodules=all HEAD
      - name: Execute Windows regressions
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p out/verification
          for test in frame-limits frame-pacing background-pause temporal-history motion-history xess-presets amd-antilag; do
            ./out/gpu/${test}-test.exe | tee -a out/verification/native-windows-tests.log
          done
          printf '%s\n' 'Camera motion: Windows executable linked; shader execution covered by Linux Vulkan regression.' | tee -a out/verification/native-windows-tests.log
          export BB_SAVE_ACCESS_TEST="$(cygpath -w "$PWD/out/gpu/save-access-test.exe")"
          "$WINPYTHON" tests/test_support_report.py
          "$WINPYTHON" tests/test_save_manager.py
      - name: Compile the Windows launcher
        shell: msys2 {0}
        run: bash packaging/windows/package.sh --launcher-only
      - name: Test the actual compiled launcher and prepare the complete package
        shell: msys2 {0}
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'preview' }}
        run: |
          set -euo pipefail
          "$WINPYTHON" tests/test_launcher_updates.py out/pyi-dist/Bloodborne/Bloodborne.exe
          "$WINPYTHON" tests/test_launcher_window_settings.py out/pyi-dist/Bloodborne/Bloodborne.exe
          "$WINPYTHON" tests/test_launcher_startup.py out/pyi-dist/Bloodborne/Bloodborne.exe
          "$WINPYTHON" tests/test_launcher_trophies_ui.py out/pyi-dist/Bloodborne/Bloodborne.exe
          "$WINPYTHON" tools/assemble_windows.py --baseline out/dependencies/runtime-baseline.zip --dll-dir "$(cygpath -w /clang64/bin)" --channel "$RELEASE_CHANNEL"
          for package in dist/*.zip; do
            "$WINPYTHON" tests/test_packaged_startup.py --package "$package" --compiled
            "$WINPYTHON" tests/test_packaged_startup.py --package "$package" --compiled --reject
            cat "$package.sha256"
          done
      - name: Upload the single package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crowned-workshop-windows-candidate
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
