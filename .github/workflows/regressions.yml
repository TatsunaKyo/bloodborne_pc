name: Regression checks
on:
  push:
    branches: [windows]
  pull_request:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-infrastructure:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Install pinned launcher dependencies
        run: python -m pip install PyInstaller==6.19.0 Pillow==12.3.0
      - name: Compile the native saves lease fixture
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          New-Item -ItemType Directory -Force out/verification | Out-Null
          cl /nologo /W4 /std:c17 /I src tests/test_save_access.c src/runtime_save_access.c /Fe:out/verification/save-access-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile and run production shader cache regressions
        shell: pwsh
        run: |
          git submodule update --init gpu/third_party/miniz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          '#define MINIZ_EXPORT' | Set-Content out/verification/miniz_export.h
          cl /nologo /O2 /EHsc /std:c++20 /I tests/cache_stubs /I gpu/shadps4 /I gpu/third_party/miniz /I out/verification tests/test_shader_cache.cpp gpu/shadps4/video_core/cache_storage.cpp gpu/shadps4/video_core/renderer_vulkan/vk_shader_util.cpp /Fe:out/verification/shader-cache-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_shader_cache.py --binary out/verification/shader-cache-test.exe 2>&1 | Tee-Object out/verification/shader-cache-windows.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_cache_warmup.py --prepare out/verification
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cl /nologo /O2 /EHsc /std:c++20 /I tests/cache_stubs /I gpu/shadps4 /I out/verification tests/test_cache_warmup.cpp /Fe:out/verification/cache-warmup-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./out/verification/cache-warmup-test.exe 2>&1 | Tee-Object out/verification/cache-warmup-windows.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Execute production presentation lock regression
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python tests/test_present_queue_scope.py --prepare out/verification/present-scope
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($name in @('revision24','current')) {
            cl /nologo /O2 /EHsc /std:c++20 "out/verification/present-scope/$name.cpp" "/Fe:out/verification/present-scope/$name.exe"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & "./out/verification/present-scope/$name.exe" 2>&1 | Tee-Object "out/verification/present-scope-$name.log"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Execute Windows privacy, archive and save recovery regressions
        shell: pwsh
        run: |
          $env:BB_SAVE_ACCESS_TEST = (Resolve-Path out/verification/save-access-test.exe).Path
          python tests/test_support_report.py 2>&1 | Tee-Object out/verification/support-windows.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_save_manager.py 2>&1 | Tee-Object out/verification/save-windows.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_update_archive.py 2>&1 | Tee-Object out/verification/update-windows.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Execute production swapchain recovery regression
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python tests/test_swapchain_recovery.py --prepare out/verification/swapchain-recovery
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($name in @('revision25','current')) {
            cl /nologo /O2 /EHsc /std:c++20 "out/verification/swapchain-recovery/$name.cpp" "/Fe:out/verification/swapchain-recovery/$name.exe"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & "./out/verification/swapchain-recovery/$name.exe" 2>&1 | Tee-Object "out/verification/swapchain-recovery-$name.log"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Compile and exercise the actual frozen Windows launcher
        shell: pwsh
        run: |
          python tools/prepare_tk_runtime.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tclData = (Resolve-Path out/tk-runtime/_tcl_data).Path
          $tkData = (Resolve-Path out/tk-runtime/_tk_data).Path
          python -m PyInstaller --noconfirm --clean --windowed --name Bloodborne --paths scripts --paths launcher --paths tools --distpath out/frozen-infrastructure --workpath out/pyi-infrastructure --specpath out/pyi-infrastructure --add-data "${tclData};_tcl_data" --add-data "${tkData};_tk_data" --hidden-import ctypes.wintypes --hidden-import dataclasses --hidden-import datetime --hidden-import ipaddress --hidden-import support_report --hidden-import support_report_ui --hidden-import save_access --hidden-import save_manager --hidden-import save_manager_ui launcher/bbport_launcher_win.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = (Resolve-Path out/frozen-infrastructure/Bloodborne/Bloodborne.exe).Path
          $script = (Resolve-Path scripts/verify_infrastructure_runtime.py).Path
          $result = Start-Process -FilePath $exe -ArgumentList @('--script', $script) -PassThru -RedirectStandardOutput out/verification/frozen-runtime.log -RedirectStandardError out/verification/frozen-runtime-errors.log
          if (-not $result.WaitForExit(90000)) {
            $result.Kill()
            Get-Content out/verification/frozen-runtime.log
            Get-Content out/verification/frozen-runtime-errors.log
            throw 'Frozen launcher self-test exceeded 90 seconds.'
          }
          if ($result.ExitCode) { Get-Content out/verification/frozen-runtime-errors.log; exit $result.ExitCode }
          Get-Content out/verification/frozen-runtime.log
      - name: Retain Windows infrastructure verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-infrastructure-records
          path: out/verification
          if-no-files-found: error
          retention-days: 14
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3-yaml python3-tk python3-pil python3-pil.imagetk xvfb fonts-dejavu-core zstd
      - name: Prepare checksum-pinned Vulkan and VMA test headers
        run: python3 tools/setup_test_headers.py
      - name: Run actual Python, renderer and UI regressions
        run: xvfb-run -a -s '-screen 0 3200x2200x24' python3 tools/ci_regressions.py --gui
      - name: Check documentation and workflow configuration
        run: python3 tests/test_project_infrastructure.py
      - name: Retain verification records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-records
          path: out/verification
          if-no-files-found: error
          retention-days: 14
