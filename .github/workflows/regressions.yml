name: Regression checks
on:
  push:
    branches: [windows, 'polish/**']
  pull_request:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-infrastructure:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Install pinned launcher checks
        run: python -m pip install PyInstaller==6.19.0 Pillow==12.3.0 -r tools/requirements-checks.txt
      - name: Check Python, documentation and all isolated launcher modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pyflakes run.py launcher scripts tools tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_docs.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/update_readme_revision.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_launcher.py --quick
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_project_infrastructure.py
      - name: Compile and test the Windows save guard
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          New-Item -ItemType Directory -Force out/verification | Out-Null
          cl /nologo /W4 /std:c17 /I src tests/test_save_access.c src/runtime_save_access.c /Fe:out/verification/save-access-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:BB_SAVE_ACCESS_TEST = (Resolve-Path out/verification/save-access-test.exe).Path
          foreach ($file in @('test_release_integrity','test_release_split','test_update_archive','test_support_report','test_save_manager')) {
            python "tests/$file.py"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Freeze and test the actual current launcher
        shell: pwsh
        run: |
          python tools/freeze_launcher.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = 'out/pyi-dist/Bloodborne/Bloodborne.exe'
          foreach ($file in @('test_launcher_updates','test_launcher_window_settings','test_launcher_startup','test_launcher_trophies_ui')) {
            python "tests/$file.py" $exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Retain verification records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-infrastructure-records
          path: out/verification
          if-no-files-found: error
          retention-days: 14
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libboost-dev libglm-dev libvulkan1 mesa-vulkan-drivers glslang-tools spirv-tools python3-venv python3-yaml python3-tk python3-pil python3-pil.imagetk xvfb fonts-dejavu-core zstd
          python3 -m venv --system-site-packages out/checks-env
          out/checks-env/bin/python -m pip install -r tools/requirements-checks.txt
      - name: Prepare checksum-pinned Vulkan and VMA test headers
        run: python3 tools/setup_test_headers.py
      - name: Run actual Python, renderer and UI regressions
        run: xvfb-run -a -s '-screen 0 3200x2200x24' out/checks-env/bin/python tools/ci_regressions.py --gui --vulkan
      - name: Check documentation and workflow configuration
        run: out/checks-env/bin/python tests/test_project_infrastructure.py
      - name: Retain verification records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-records
          path: out/verification
          if-no-files-found: error
          retention-days: 14
